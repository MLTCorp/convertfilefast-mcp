[project]
name = "convertfilefast-mcp"
version = "0.1.6"
description = "MCP server for ConvertFileFast - convert 50+ file formats, run PDF/image operations, create billing links, and report feedback as AI-agent tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ConvertFileFast" }]
keywords = ["mcp", "model-context-protocol", "pdf", "file-conversion", "convert", "agents"]
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://www.convertfilefast.com"
Documentation = "https://www.convertfilefast.com/en/use-case/mcp-server"
Repository = "https://github.com/MLTCorp/convertfilefast-mcp"

[project.scripts]
convertfilefast-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
